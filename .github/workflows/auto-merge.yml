name: Auto-merge safe PRs

on:
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    # Only bother running when the safe-auto label is (still) present.
    if: contains(github.event.pull_request.labels.*.name, 'safe-auto')
    runs-on: ubuntu-latest
    steps:
      - name: Check changed files against the safe-path allowlist
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          UNSAFE_FILE: ${{ runner.temp }}/unsafe-files.txt
        run: |
          set -euo pipefail

          : > "$UNSAFE_FILE"

          files="$(gh pr diff "$PR_NUMBER" --repo "$REPO" --name-only)"
          echo "Changed files in PR #$PR_NUMBER:"
          echo "$files"

          while IFS= read -r f; do
            [ -z "$f" ] && continue

            is_safe=false
            case "$f" in
              content/*) is_safe=true ;;
              docs/*) is_safe=true ;;
              reports/*) is_safe=true ;;
              *.test.ts|*.test.tsx) is_safe=true ;;
            esac

            # Root-level *.md only (no directory separator in the path).
            if [ "$is_safe" = false ]; then
              case "$f" in
                */*) : ;; # nested path, not root-level -> stays unsafe
                *.md) is_safe=true ;;
              esac
            fi

            if [ "$is_safe" = false ]; then
              echo "$f" >> "$UNSAFE_FILE"
            fi
          done <<< "$files"

          if [ -s "$UNSAFE_FILE" ]; then
            echo "Files outside the safe-auto allowlist:"
            cat "$UNSAFE_FILE"
            echo "unsafe=true" >> "$GITHUB_OUTPUT"
          else
            echo "All changed files are within the safe-auto allowlist."
            echo "unsafe=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Block auto-merge and remove label (unsafe paths detected)
        if: steps.guard.outputs.unsafe == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          UNSAFE_FILE: ${{ runner.temp }}/unsafe-files.txt
        run: |
          set -euo pipefail
          {
            echo "The \`safe-auto\` label was removed because this PR touches files outside the safe-auto allowlist:"
            echo
            echo '```'
            cat "$UNSAFE_FILE"
            echo '```'
            echo
            echo "Allowlist: \`content/**\`, \`docs/**\`, \`reports/**\`, root-level \`*.md\`, \`**/*.test.ts\`, \`**/*.test.tsx\`."
            echo "This PR needs a human review and manual merge."
          } > "$RUNNER_TEMP/comment-body.md"
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file "$RUNNER_TEMP/comment-body.md"
          gh pr edit "$PR_NUMBER" --repo "$REPO" --remove-label "safe-auto"

      - name: Enable auto-merge (squash)
        if: steps.guard.outputs.unsafe == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" --repo "$REPO" --auto --squash
