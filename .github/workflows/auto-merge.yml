name: Auto-merge safe PRs

on:
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    # Only bother running when the safe-auto label is (still) present.
    if: contains(github.event.pull_request.labels.*.name, 'safe-auto')
    runs-on: ubuntu-latest
    steps:
      - name: Check changed files against the safe-path allowlist
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          UNSAFE_FILE: ${{ runner.temp }}/unsafe-files.txt
        run: |
          set -euo pipefail

          : > "$UNSAFE_FILE"

          files="$(gh pr diff "$PR_NUMBER" --repo "$REPO" --name-only)"
          echo "Changed files in PR #$PR_NUMBER:"
          echo "$files"

          while IFS= read -r f; do
            [ -z "$f" ] && continue

            is_safe=false
            case "$f" in
              content/*) is_safe=true ;;
              docs/*) is_safe=true ;;
              reports/*) is_safe=true ;;
              *.test.ts|*.test.tsx) is_safe=true ;;
              # Generated content artifacts under src/content/ ONLY
              # (docs/reports-surface.md §5/§6 PR 1) — every routine report
              # PR now touches a committed `src/content/*.generated.json`
              # (provenance.generated.json, and as of this PR
              # runs.generated.json too), which would otherwise strip
              # `safe-auto` from routine bookkeeping PRs. Defensible: these
              # files are machine-generated, Zod-validated, non-executable
              # JSON whose freshness is proven by the drift gate in the SAME
              # required `build` job/PR. Do NOT widen this to anything else
              # under src/ — this pattern intentionally does not match
              # `.ts`/`.tsx` source.
              src/content/*.generated.json) is_safe=true ;;
            esac

            # Root-level *.md only (no directory separator in the path).
            if [ "$is_safe" = false ]; then
              case "$f" in
                */*) : ;; # nested path, not root-level -> stays unsafe
                *.md) is_safe=true ;;
              esac
            fi

            if [ "$is_safe" = false ]; then
              echo "$f" >> "$UNSAFE_FILE"
            fi
          done <<< "$files"

          if [ -s "$UNSAFE_FILE" ]; then
            echo "Files outside the safe-auto allowlist:"
            cat "$UNSAFE_FILE"
            echo "unsafe=true" >> "$GITHUB_OUTPUT"
          else
            echo "All changed files are within the safe-auto allowlist."
            echo "unsafe=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Block auto-merge and remove label (unsafe paths detected)
        if: steps.guard.outputs.unsafe == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          UNSAFE_FILE: ${{ runner.temp }}/unsafe-files.txt
        run: |
          set -euo pipefail

          # Disarm first. `gh pr merge --auto` is sticky repo-side state: if
          # an earlier commit on this PR was safe and armed auto-merge, then
          # a later commit introduced an unsafe path, removing the
          # `safe-auto` label alone does NOT cancel the still-armed
          # auto-merge — GitHub will squash-merge the unreviewed commit the
          # moment CI goes green. `--disable-auto` exits non-zero when the PR
          # never had auto-merge armed in the first place (the common case:
          # most PRs that touch an unsafe path never got labeled `safe-auto`
          # at all), which is an expected outcome, not a failure. Capture the
          # exit code explicitly instead of a blanket `|| true` so the step
          # stays fail-safe (label removal and the comment below always run)
          # while a genuine `gh` failure (auth, API outage) is still visible
          # in the log rather than being silently swallowed.
          disable_status=0
          gh pr merge "$PR_NUMBER" --repo "$REPO" --disable-auto || disable_status=$?
          if [ "$disable_status" -ne 0 ]; then
            echo "note: 'gh pr merge --disable-auto' exited $disable_status — PR most likely had no auto-merge armed. Continuing."
          else
            echo "Auto-merge disarmed for PR #$PR_NUMBER."
          fi

          {
            echo "The \`safe-auto\` label was removed and auto-merge disarmed because this PR touches files outside the safe-auto allowlist:"
            echo
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              echo "    $f"
            done < "$UNSAFE_FILE"
            echo
            echo "Allowlist: \`content/**\`, \`docs/**\`, \`reports/**\`, root-level \`*.md\`, \`**/*.test.ts\`, \`**/*.test.tsx\`, \`src/content/*.generated.json\`."
            echo "This PR needs a human review and manual merge."
          } > "$RUNNER_TEMP/comment-body.md"
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file "$RUNNER_TEMP/comment-body.md"
          gh pr edit "$PR_NUMBER" --repo "$REPO" --remove-label "safe-auto"

      - name: Enable auto-merge (squash)
        if: steps.guard.outputs.unsafe == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" --repo "$REPO" --auto --squash
