name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deployed_url:
        description: >-
          Deployed URL to smoke-check (e.g. a Vercel preview). Leave blank to
          skip — see the `deployed-smoke` job below.
        required: false
        type: string

permissions:
  contents: read

jobs:
  # CRITICAL: this job's name ("build") is depended on by branch protection
  # as the required "CI / build" check (.github/AUTO-MERGE-SETUP.md) — never
  # rename it. New steps are safe to add here (they become part of the same
  # required check with zero extra config); a new JOB is not required unless
  # Dom deliberately adds it to branch protection (see each new job's comment
  # below for why it isn't part of this one).
  build:
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0` (full history, not the default shallow clone) is a
      # hard requirement of the provenance generator (`scripts/provenance/
      # generate.mjs`, `npm run pretest`/`prebuild`): it resolves each
      # report's `produced` files via `git log --diff-filter=A`, which needs
      # complete history. A shallow clone doesn't error there — it silently
      # truncates results — so the generator itself hard-fails the build if
      # it detects a shallow clone (docs/provenance-model.md §5.2/§5.3) as a
      # second line of defense; this is the fix, not just the catch.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails on any high/critical advisory except the reviewed, documented
      # exceptions in audit-ci.jsonc. Replaces raw `npm audit --audit-level=high`,
      # which has no per-advisory allowlist and so cannot distinguish a live vuln
      # from a non-applicable or already-patched-but-misreported one.
      - name: Audit dependencies (fail on high/critical)
        run: npx audit-ci --config ./audit-ci.jsonc

      # `npm run lint` (eslint) existed only as a convention agents ran by
      # hand — nothing in CI actually ran it, so a lint failure could not
      # block a merge (including an auto-merged `safe-auto` PR). Verified
      # green on `main` before adding this as a required step (0 errors,
      # 12 pre-existing `react-refresh/only-export-components` warnings,
      # which do not fail the process — eslint only exits non-zero on an
      # error). Placed first among the cheap checks (before typecheck) so a
      # lint failure fails fast, ahead of the far more expensive build steps
      # below.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # `npm test` is hermetic by design (node-environment, fake `git`/`gh`
      # runners everywhere, no network) — it used to also carry three
      # real-`gh`, real-network tests (`check-backlog-checkoffs.test.ts`'s
      # "real corpus" block, PR #110, 2026-08-06), which needed a `GH_TOKEN`
      # here purely because `gh` refuses to run inside Actions without one.
      # That PR fixed the immediate red but flagged the underlying design
      # smell: should this repo's default, every-contributor gate depend on
      # a GitHub session at all? Decided NO (BACKLOG.md MEDIUM, 2026-08-07):
      # those three tests moved to `check-backlog-checkoffs.real-corpus
      # .test.ts`, run via `npm run test:real-corpus` in the
      # `backlog-checkoffs` job below instead — the one job that already
      # carries `GH_TOKEN` and an existing `gh`-dependent step for the
      # identical reason, so the network/session dependency stays contained
      # to a single advisory lane instead of spreading into this required
      # job. See that test file's header for the full rationale.
      - name: Test
        run: npm test

      # Human-readable provenance table (file -> author -> reviewer -> judge
      # -> commit -> tokens), run so it lands in this check's log — the
      # mitigation docs/provenance-model.md §5.3 names for the artifact
      # itself never being committed/visible in a PR diff. No-ops cleanly
      # (prints "no records yet") until a report ships a `yaml provenance`
      # block (§12 PR 6, backfill).
      - name: Provenance table
        run: npm run provenance:print

      # Real-DOM mount (jsdom + StrictMode) of every static route AND every
      # committed project/post (full coverage, not a sample of one — see
      # src/smoke/routes.smoke.test.tsx's "COVERAGE — NO SAMPLING" note) —
      # catches the class of bug a `renderToStaticMarkup` harness
      # structurally cannot (double-invoke-only bugs; see that file's
      # header comment for the 2026-07-18 dead-TOC-anchor incident this
      # gate exists because of). Cheap (~4s for 16 routes today) — kept IN
      # this required job rather than a separate opt-in one, since it
      # directly guards a pattern that has now shipped a P0 four runs
      # running.
      # BACKLOG MEDIUM (2026-07-19): this suite failed once
      # (`1 failed | 15 passed`) immediately after PRs #20/#22/#24 landed,
      # then ran green 16/16 on seven subsequent attempts — the failure
      # output vanished before anyone could look at it. `--retry=0` is
      # spelled out explicitly below (it is vitest's own default — see
      # vitest.smoke.config.ts, which sets no `test.retry`) so that fact is
      # visible in this file rather than resting on an unstated default that
      # a future edit could silently change; a hidden retry is exactly the
      # kind of thing that would turn a real intermittent failure into a
      # quiet, undiagnosable green. The `json` reporter + `--outputFile`
      # write full per-test results (including the failing assertion,
      # stack, and timing) to disk regardless of pass/fail; on failure the
      # step below uploads it as a CI artifact (same `upload-artifact`
      # pattern as the `e2e` job's Playwright report) so the NEXT occurrence
      # of this flake leaves evidence instead of vanishing again.
      - name: Smoke test (real DOM mount, StrictMode)
        id: smoke
        run: npm run test:smoke -- --retry=0 --reporter=default --reporter=json --outputFile=test-results/smoke-results.json

      # Conditioned on THIS step's own conclusion, not a bare `if: failure()`.
      # A bare `failure()` fires whenever any EARLIER step in the job failed
      # (lint, typecheck, audit, `npm test`) — and on those runs the smoke
      # step never executed, so `smoke-results.json` does not exist and the
      # run would publish an empty artifact named `smoke-test-results`. That
      # is worse than no artifact: the whole point of this item is that the
      # next occurrence of the flake leaves EVIDENCE, and an artifact that
      # shows up empty on unrelated failures is exactly how people learn to
      # ignore it. `if-no-files-found: error` keeps it honest — if this step
      # ever runs and finds nothing, that is itself a defect worth surfacing
      # rather than warning past.
      - name: Upload smoke test results (on smoke failure)
        if: failure() && steps.smoke.conclusion == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: test-results/smoke-results.json
          if-no-files-found: error
          retention-days: 7

      # Component-level interaction tests (BACKLOG "Component-level test
      # infrastructure is missing repo-wide") — jsdom + Testing Library
      # mounts of individual components (src/**/*.test.tsx), asserting on
      # real rendered DOM/clicks/focus rather than only props or a full-route
      # smoke mount. See vitest.component.config.ts's header comment for how
      # this differs from the `test` and `test:smoke` steps above it.
      - name: Component test (jsdom, Testing Library)
        run: npm run test:component

      # Content-validation gate (BACKLOG "Content-validation gate in CI"):
      # date-matches-filename, canonical YYYY-MM-DD, same-day posts each
      # declare a distinct `order`, author/authors resolve to a cast member.
      # Promoted from a separate NON-required job into this required `build`
      # job on 2026-07-21: as its own job it green-passed but gated nothing —
      # a content-only PR could `safe-auto` auto-merge without ever running it
      # (found in the 2026-07-21 team review). Currently green (24/24).
      - name: Validate content frontmatter
        run: npm run validate:content

      # Report-claims gate (BACKLOG.md MEDIUM, 2026-08-01) — PR #81 told Dom
      # its branch was "BACKLOG.md + this report" while its real diff was
      # `reports/2026-07-31.md` alone; four backlog findings sat only in the
      # Notion mirror for a day because nothing checked that claim against
      # the branch's own `git diff`. `scripts/check-report-claims.mjs`'s
      # header comment has the full scope/rationale (deliberately narrow:
      # only paths named in text that also names THIS branch, never a
      # prose-completeness grade). Needs `fetch-depth: 0` (set above) to
      # resolve `origin/main` as a base ref; exits 2 (loud, still non-zero,
      # still fails this required check) rather than silently passing if it
      # can't.
      - name: Report claims match this branch's diff
        run: npm run check:report-claims

      # Merge-revert gate (BACKLOG.md HIGH, 2026-08-02) — the true root cause
      # of the 2026-07-31 loss: an in-branch `git merge main` on
      # `team/2026-07-31-backlog-and-report` resolved a `BACKLOG.md` conflict
      # entirely in `main`'s favour, reverting the branch's own two commits'
      # worth of additions to exact zero net diff (`56e8dfb`..`1e5e5e8`).
      # `scripts/check-merge-revert.mjs`'s header comment has the full
      # algorithm and false-positive analysis (strictly stronger than the
      # report-claims gate above: needs no report, no prose, and catches it
      # the moment the merge happens, not after someone writes about it).
      #
      # `MERGE_REVERT_HEAD_SHA` is REQUIRED here, not optional — on a
      # `pull_request` event, `actions/checkout`'s default `HEAD` is GitHub's
      # synthetic test-merge commit (`refs/pull/<N>/merge`), whose first
      # parent is `main`, not this branch. Without this override the check
      # would walk `main`'s own history under a misleading "HEAD" name and
      # silently pass every PR — the script refuses to do that (exits 2,
      # INCONCLUSIVE) if this env var is ever missing on a pull_request run;
      # see the script's `resolveHeadRef` for the guard. Needs the same
      # `fetch-depth: 0` set on this job's Checkout step above (the script
      # also independently checks `git rev-parse --is-shallow-repository`
      # and refuses to run against a shallow clone rather than risk a
      # merge-base silently resolved against truncated history).
      - name: Branch's own edits survived any in-branch merge (no silent revert)
        env:
          MERGE_REVERT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npm run check:merge-revert

      - name: Build
        run: npm run build

      # Dist-side CSP hash assertion (security-auditor P2, PR #42 review).
      # `inlineScriptHash.test.ts` (part of `npm test` above) already checks
      # the CSP hash in vercel.json against the SOURCE index.html — but the
      # browser only ever receives `dist/index.html`, and the two are
      # byte-identical today only by coincidence (Vite happens not to touch
      # this inline script), not by any enforced guarantee. A future Vite
      # version bump could change what actually ships to dist/ without
      # touching index.html at all, silently breaking dark-mode-before-paint
      # in production while every other gate stays green. This step re-runs
      # the same check (same code, reused from src/lib/csp/inlineScriptHash.ts)
      # against the real BUILD OUTPUT. Must run after `Build` above — see
      # src/lib/csp/distIndexHash.test.ts's header comment for the full case.
      - name: Verify dist/index.html CSP hash (post-build)
        run: npm run verify:dist-csp-hash

      # Provenance artifact drift gate (§5.3). The committed
      # `src/content/provenance.generated.json` MUST equal what the generator
      # produces from full history. `npm test` and `npm run build` above both
      # regenerated it (via pre* hooks) in this full-clone checkout
      # (`fetch-depth: 0`), so a stale commit — a `yaml provenance` block
      # changed without regenerating + committing the artifact — shows up as a
      # working-tree diff here and fails this required check. That freshness
      # guarantee is exactly what makes the Vercel DEPLOY build's fallback to
      # the committed artifact safe when it can't read git history (a shallow
      # clone): the file it falls back to is provably up to date.
      - name: Provenance artifact is up to date (drift gate)
        run: git diff --exit-code src/content/provenance.generated.json

      # Runs artifact drift gate (docs/reports-surface.md §3.2 / §6 PR 1) —
      # same mechanism as the provenance drift gate immediately above, for
      # the SAME generator's second committed output
      # (`src/content/runs.generated.json`, written by the same
      # `predev`/`prebuild`/`pretest` hooks). No consumer exists yet (this
      # PR is schema + generator only), but the artifact is committed from
      # day one for the same reason `provenance.generated.json` is (the
      # 2026-07-27 "commit the artifact" reversal, and Vercel's shallow-clone
      # fallback) — so its own freshness needs its own gate immediately, not
      # deferred to whichever PR adds the first consumer.
      - name: Runs artifact is up to date (drift gate)
        run: git diff --exit-code src/content/runs.generated.json

  # Plain HTTP smoke check against a REAL deployed URL (Vercel preview or
  # production) — see scripts/check-deployed-routes.mjs's header comment for
  # why this exists (2026-07-18: every route but `/` 404'd in production,
  # SPA with no rewrite rule; localhost stayed green throughout because
  # Vite's dev server hides the exact failure mode this checks for).
  #
  # Deliberately NOT wired into `build` and deliberately NOT required:
  # `build` runs on every PR, long before any preview deployment is
  # guaranteed to exist. This job runs alongside it but the script itself
  # no-ops (exit 0, clearly logged as SKIPPED) whenever no URL is supplied,
  # so it never blocks a PR just because a preview isn't ready yet.
  #
  # HOW DOM TURNS THIS ON:
  #   1. One-time, per repo: Settings -> Secrets and variables -> Actions ->
  #      Variables -> New repository variable `SMOKE_URL` set to a STABLE
  #      URL (production, once launched, or a fixed alias domain) — this
  #      makes the check run automatically on every PR from then on.
  #   2. Ad hoc, for any single preview: Actions -> "CI" workflow -> "Run
  #      workflow" -> fill in `deployed_url` with that PR's Vercel preview
  #      URL, or run `gh workflow run ci.yml -f deployed_url=<preview-url>`.
  #   3. Only once satisfied this is stable, add "deployed-smoke" to
  #      branch protection's required-checks list if it should ever block
  #      merges — it does not by default.
  deployed-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check deployed routes (skips cleanly if no URL configured)
        env:
          SMOKE_URL: ${{ github.event.inputs.deployed_url || vars.SMOKE_URL }}
        run: node scripts/check-deployed-routes.mjs

  # Backlog-checkoff gate (BACKLOG.md MEDIUM, 2026-08-05 — "Nothing checks
  # that a run's shipped lanes get checked off in BACKLOG.md, and it just
  # failed for the fifth time") — PR #100 shipped three merged PRs
  # (#97/#98/#99) that `BACKLOG.md` never once cited by branch name.
  # `scripts/check-backlog-checkoffs.mjs`'s header has the full rule/scope;
  # short version: every `Item | Branch | PR`-shaped row across
  # `reports/*.md` whose branch has a real MERGED pull request (per `gh pr
  # list`, never the report's own prose) must be cited inside a `[x]`-checked
  # `BACKLOG.md` bullet somewhere.
  #
  # DELIBERATELY NOT REQUIRED, same reasoning as `deployed-smoke` above and
  # `check-stranded-branches.mjs`'s own header: this check's FIRST real run
  # against this repo's real corpus found a genuine, live violation
  # (`team/2026-08-04-undici-advisories`, PR #101 — fixed in the same
  # `BACKLOG.md` edit this job's own introducing PR ships), so it has no
  # track record yet of staying green for the right reasons. A gate wired
  # required on day one, the moment after its first run was red, is exactly
  # the "born failing" shape this repo's standing rule rejects. Promote it
  # into `build`'s required steps once it has run clean across real PR
  # traffic for a while — the same path `validate:content` took (shipped
  # advisory, promoted once proven, 2026-07-21).
  #
  # NO `fetch-depth: 0` NEEDED — unlike the report-claims/merge-revert steps
  # in `build`, this script does no `git log`/`git diff` at all: it reads
  # `reports/*.md` + `BACKLOG.md` as plain files from whatever is checked
  # out (a shallow clone's working tree is complete; only its history is
  # truncated) and asks GitHub, not local git history, which branches
  # merged — see the script's own header, "FETCH-DEPTH — DELIBERATELY NOT
  # NEEDED", for the by-inspection verification that it makes zero git
  # calls. Default `actions/checkout@v4` is enough.
  #
  # `pull-requests: read` is the only permission this job needs (`gh pr
  # list` against this repo, nothing else) — job-level `permissions:`
  # REPLACES the workflow-default `contents: read` for this job, so `write`
  # access to anything is never granted here, matching `notify-on-failure`'s
  # own least-privilege precedent.
  backlog-checkoffs:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # No `npm ci` for the check script itself (like `check-deployed-
      # routes.mjs` above, it's dependency-free — node builtins + the `gh`
      # CLI only). It IS needed for the "Real-corpus test" step below, which
      # runs through `vitest` (a devDependency) — see that step's own
      # comment for why it's worth the install cost in this one job.
      - name: Install dependencies (needed for the real-corpus vitest step below)
        run: npm ci

      - name: Every merged branch a run report names is checked off in BACKLOG.md (reporting only, does not block merge)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-backlog-checkoffs.mjs

      # BACKLOG.md MEDIUM (2026-08-06/07) — the three real-`gh`, real-network
      # tests that assert THIS SCRIPT's behavior against this repo's actual
      # PR history used to live inside `npm test` (the required `build`
      # job's default, hermetic sweep); they moved here instead, alongside
      # the script run immediately above that already needs the identical
      # `GH_TOKEN` + network dependency. This is the step that proves the
      # split didn't quietly stop checking anything: it runs on EVERY PR
      # (this job has no path/branch filter beyond the workflow's own
      # `pull_request` trigger), and `check-backlog-checkoffs.real-corpus
      # .test.ts`'s own `GH_PROBE` hard-`throw`s (not skips) if `GH_TOKEN`
      # is ever missing while `CI` is set — see that file's header for the
      # full "must never silently check nothing" guard.
      - name: Real-corpus test — check-backlog-checkoffs.mjs against this repo's actual gh pr history
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run test:real-corpus

  # Real-browser lane (BACKLOG P1 "Real-browser responsive/visual testing") —
  # Playwright against `vite preview`'s `dist/` output at 375/768/1280. See
  # `playwright.config.ts`'s header comment for the full "why" and
  # `e2e/*.spec.ts` for what each file actually catches (the 2026-07-17/18
  # mobile-metadata regression class, horizontal overflow, the mobile drawer
  # focus trap in a real browser, and real axe `color-contrast` — the first
  # place that rule has ever actually run against this app, since jsdom has
  # no canvas and silently skips it in every existing `axe.run()` call).
  #
  # DELIBERATELY NOT REQUIRED (not in branch protection, not part of the
  # `build` job) — a considered sequencing call, not an oversight:
  #   1. This lane is BRAND NEW as of 2026-07-24. Playwright suites are
  #      notoriously flaky on first introduction, and just wiring this one up
  #      locally surfaced three distinct real timing races before it was
  #      stable (a webServer host/IP mismatch, a Suspense-fallback
  #      navigation race, and a CSS `transition: background-color` race on
  #      the dark-mode check) — strong evidence that CI's runner
  #      (different OS, different load, cold caches) could surface more that
  #      local macOS runs never hit. Blocking merges on an unproven gate is
  #      how you get "disable the flaky check" pressure later.
  #   2. It ALREADY found one genuine, real, pre-existing AA contrast
  #      violation on first real run (`Callout`'s `watch-out` tone — see
  #      `e2e/contrast.spec.ts`'s `KNOWN_VIOLATIONS`) that no existing gate
  #      had ever caught. Tracked explicitly rather than silently allowed,
  #      but making a brand-new, unproven lane block EVERY unrelated PR on
  #      day one over a pre-existing, already-tracked issue is the wrong
  #      first impression for the gate itself.
  #   3. `deployed-smoke` above sets the precedent for this repo's own
  #      "advisory first" pattern; the content-validation gate
  #      (`validate:content`) is the precedent for "promote once proven" —
  #      it shipped non-required, then was promoted into the required
  #      `build` job on 2026-07-21 once real usage showed it never went red
  #      for the wrong reason.
  #
  # RECOMMENDATION (Dom's call, per the studio's human-in-the-loop rule):
  # run this advisory for a couple of weeks of real PR traffic; once it's
  # gone zero-false-positive across a run of PRs on the actual GitHub
  # Actions runner (not just local), promote it the same way — add its
  # steps into (or add its job name to) the required check list.
  #
  # Chromium only: covers the actual regression classes this lane targets
  # (responsive layout, focus, contrast) without doubling CI time for
  # cross-browser rendering differences this app doesn't have known exposure
  # to (no browser-specific CSS, no non-standard APIs). Revisit if a bug
  # ever ships that only reproduces in Firefox/WebKit.
  e2e:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0` for the same reason as the `build` job above: this
      # job's own `npm run build` step runs the provenance generator via its
      # `prebuild` hook, which hard-fails on a shallow clone by design
      # (docs/provenance-model.md §5.2/§5.3).
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (chromium only)
        run: npx playwright install --with-deps chromium

      # Explicit step (not `test:e2e`'s `pretest:e2e` hook) so the build log
      # is visible as its own step here, matching the `build` job above.
      - name: Build
        run: npm run build

      - name: E2E tests (Playwright, real browser, 375/768/1280)
        run: npx playwright test

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # BACKLOG MEDIUM (2026-07-31 run) "Nothing surfaces a red CI check, and
  # nobody reads the artifacts" — PR #69's `e2e` failed 2026-07-29 and sat
  # red and unexamined for two days behind six queued green PRs, even though
  # the `playwright-report` artifact that root-caused it (07-31) had been
  # sitting there the whole time. This job closes gap (a): it does NOT make
  # `e2e` required or touch branch protection (see that job's own header
  # comment for why it stays advisory) — it only makes a red check visible
  # where a human reviewing this PR is already looking, with the exact
  # command to pull the evidence BEFORE anyone re-runs the job and destroys
  # it (gap (b) is the matching README step, not code).
  #
  # No checkout, no third-party action — `gh`, built into the runner, using
  # the workflow's own `GITHUB_TOKEN`. Idempotent: finds its own previous
  # comment via an HTML-comment marker and edits it in place on every
  # re-run, instead of piling up a new comment per attempt.
  #
  # Least privilege: only `pull-requests: write` is granted (job-level
  # `permissions:` REPLACES the workflow default for this job, it does not
  # add to it — see https://docs.github.com/actions/security-guide -
  # `contents` and everything else this job doesn't list is implicitly
  # `none`). This job never merges, labels, or edits anything but its own
  # comment.
  #
  # `pull_request` only (not `workflow_dispatch`, which has no PR to comment
  # on) — enforced by the `github.event_name` check below, on top of the
  # fact that `needs: [build, e2e]` already means this only runs for events
  # where both of those jobs ran.
  #
  # FORK PRs: SKIPPED, deliberately, not attempted-and-failed. A
  # `pull_request` (not `pull_request_target`) run from a fork gets a
  # READ-ONLY `GITHUB_TOKEN` regardless of the `permissions:` block below —
  # a GitHub platform rule this workflow does not opt out of (this repo runs
  # no `pull_request_target` anywhere, the safer default for a repo that may
  # take external PRs). Without the `head.repo.fork == false` guard, this
  # job would 403 and go red on EVERY fork PR for a reason that has nothing
  # to do with the code under review — manufacturing a permanently-red,
  # unrelated check is exactly the "red and unread" failure mode this item
  # exists to fix, so it skips cleanly instead: the job shows as `skipped`
  # in the checks list (not `failure`), and this comment is the legible
  # reason why (visible via "View workflow file" on that job). The
  # `gh run download` step in README's CI gates section still applies
  # manually on a fork PR — only the auto-comment is skipped, not the
  # artifact. Revisit (e.g. a maintainer re-run via `workflow_dispatch` with
  # a PR-comment step, or a trusted `pull_request_target` companion workflow
  # with its own tight scope) if/when this repo starts taking fork PRs for
  # real.
  notify-on-failure:
    needs: [build, e2e]
    if: >-
      always() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.fork == false &&
      (needs.build.result == 'failure' || needs.e2e.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment which check failed + exact artifact download command (edit in place on re-run)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          BUILD_RESULT: ${{ needs.build.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          COMMENT_FILE: ${{ runner.temp }}/ci-failure-comment.md
        run: |
          set -euo pipefail

          MARKER="<!-- ci-red-surfacing -->"

          {
            echo "$MARKER"
            echo "### CI failed on this PR (run #$RUN_ID)"
            echo
            if [ "$BUILD_RESULT" = "failure" ]; then
              echo "- **\`build\` (required — blocks merge)** failed. If the failing step was \"Smoke test\", its results are attached as the \`smoke-test-results\` artifact; otherwise check the \`build\` job log for which step failed — most other steps in that job don't upload an artifact."
            fi
            if [ "$E2E_RESULT" = "failure" ]; then
              echo "- **\`e2e\` (advisory — does NOT block merge, deliberately non-required)** failed. Its Playwright HTML report + trace is attached as the \`playwright-report\` artifact."
            fi
            echo
            echo "**Download the artifact(s) before re-running this workflow** — a re-run overwrites the run these artifacts came from, and the artifact is usually the cheapest evidence available (see README's CI gates section)."
            echo
            echo '```'
            echo "gh run download $RUN_ID --repo $REPO"
            echo '```'
            echo
            echo "(Downloads every artifact attached to this run; add \`-n <name>\` to fetch just one, e.g. \`-n playwright-report\`.) Or: Actions tab -> this run -> Summary -> Artifacts."
            echo
            echo "_This comment is edited in place on re-runs, not reposted — see \`notify-on-failure\` in \`.github/workflows/ci.yml\`._"
          } > "$COMMENT_FILE"

          # `gh api --jq` takes a single jq expression with no separate
          # `--arg` flag, so the marker is inlined directly rather than
          # passed as a jq variable — safe here since it's a fixed constant
          # (must match the "$MARKER" written into the comment body above).
          existing_id="$(gh api -X GET "repos/$REPO/issues/$PR_NUMBER/comments" -f per_page=100 \
            --jq '[.[] | select(.body | startswith("<!-- ci-red-surfacing -->"))] | last.id // empty')"

          if [ -n "$existing_id" ]; then
            echo "Updating existing CI-failure comment #$existing_id in place."
            gh api -X PATCH "repos/$REPO/issues/comments/$existing_id" -F body=@"$COMMENT_FILE"
          else
            echo "No existing CI-failure comment found; posting a new one."
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file "$COMMENT_FILE"
          fi
